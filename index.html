<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有聲書：瘋了！筆下女魔頭從書裡跑出來了</title>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background-color: #fcf9f2;
            color: #333;
            line-height: 1.8;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            color: #4a4a4a;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .doc-link {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .doc-link a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
            background-color: #f0f4f8;
            border-radius: 15px;
            transition: 0.3s;
        }
        .doc-link a:hover {
            background-color: #dbeafe;
        }
        .chapter-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        select {
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            width: 70%;
            cursor: pointer;
        }
        h2 { font-size: 18px; color: #666; text-align: center; margin-bottom: 20px;}
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0 30px 0;
        }
        button {
            background-color: #d4a5a5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #c08585; }
        .text-display p {
            font-size: 17px;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.3s;
            cursor: pointer;
            text-indent: 2em;
            letter-spacing: 0.5px;
        }
        .text-display p:hover { background-color: #fafafa; }
        .highlight {
            background-color: #ffe8e8 !important;
            font-weight: bold;
            color: #b35959;
        }
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; font-size: 20px; color: #b35959; font-weight: bold;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #d4a5a5;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">從 Google 載入有聲書資料中...</div>
    </div>

    <div class="container">
        <h1>瘋了！筆下女魔頭從書裡跑出來了</h1>
        
        <div class="doc-link">
            <a href="https://docs.google.com/document/d/1T-PYFvGjYdqLqQQi3nnaQ2u7eMn68eMSHUFjgR1fc_s/edit?usp=sharing" target="_blank">
                📖 點此開啟閱讀原始 Google 文件
            </a>
        </div>
        
        <div class="chapter-selector">
            <label for="chapter-select"><strong>目錄：</strong></label>
            <select id="chapter-select" onchange="changeChapter()"></select>
        </div>

        <h2 id="chapter-title"></h2>
        
        <div class="controls">
            <button id="btn-play" onclick="togglePlay()">▶️ 播放 / 暫停</button>
            <button id="btn-sync" onclick="syncProgress()">☁️ 儲存進度至雲端</button>
        </div>

        <div id="text-display" class="text-display"></div>
    </div>

    <script>
        // 您的 GAS 網址
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwqkMTvEFo-gtBXWWCm0B6wK-HrxT6q4qkwjl-nMw_g5Apjk_4vyLdVE0HKWRAgB38opA/exec"; 
        const USER_ID = "my_audio_user"; 

        let novelData = []; 
        let currentChapter = 0;
        let currentParagraph = 0;
        let isPlaying = false;
        let synth = window.speechSynthesis;

        // ==========================================
        // 萬無一失的 JSONP 資料讀取機制
        // ==========================================
        function fetchJSONP(url) {
            return new Promise((resolve, reject) => {
                const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    document.body.removeChild(script);
                    resolve(data);
                };

                const script = document.createElement('script');
                script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }

        // 初始化
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // 1. 抓取小說內容
                document.getElementById("loading-text").innerText = "讀取小說章節中...";
                let novelResponse = await fetchJSONP(GAS_WEB_APP_URL + "?action=getNovel");
                if (novelResponse.error) throw new Error(novelResponse.error);
                novelData = novelResponse;

                // 2. 抓取閱讀進度
                document.getElementById("loading-text").innerText = "載入上次進度中...";
                let progressResponse = await fetchJSONP(GAS_WEB_APP_URL + "?action=getProgress&userId=" + USER_ID);
                currentChapter = progressResponse.chapter || parseInt(localStorage.getItem('audiobook_progress_chapter')) || 0;
                currentParagraph = progressResponse.paragraphIndex || parseInt(localStorage.getItem('audiobook_progress_para')) || 0;

                buildChapterSelect();   
                renderText();
                document.getElementById("loading-overlay").style.display = "none";
            } catch(e) {
                console.error(e);
                alert("載入失敗！請確認 GAS 已「建立新版本」重新部署，且執行身分為「我」。錯誤詳情請看開發者主控台。");
                document.getElementById("loading-text").innerText = "載入失敗 ❌";
            }
        });

        // 以下為原有的介面控制邏輯
        function buildChapterSelect() {
            const select = document.getElementById("chapter-select");
            select.innerHTML = "";
            novelData.forEach((chapter, index) => {
                let option = document.createElement("option");
                option.value = index;
                option.text = chapter.title;
                if(index === currentChapter) option.selected = true;
                select.appendChild(option);
            });
        }

        function changeChapter() {
            const select = document.getElementById("chapter-select");
            currentChapter = parseInt(select.value);
            currentParagraph = 0; 
            synth.cancel();
            renderText();
            if(isPlaying) readParagraph();
        }

        function renderText() {
            if(!novelData[currentChapter]) return;
            document.getElementById("chapter-title").innerText = novelData[currentChapter].title;
            const display = document.getElementById("text-display");
            display.innerHTML = "";
            
            novelData[currentChapter].paragraphs.forEach((pText, index) => {
                let p = document.createElement("p");
                p.innerText = pText;
                p.id = "p-" + index;
                if(index === currentParagraph) p.classList.add("highlight");
                
                p.onclick = () => {
                    currentParagraph = index;
                    synth.cancel();
                    renderText();
                    if(isPlaying) readParagraph();
                };
                display.appendChild(p);
            });
            
            const activeP = document.getElementById("p-" + currentParagraph);
            if(activeP) activeP.scrollIntoView({ behavior: "smooth", block: "center" });
            
            document.getElementById("chapter-select").value = currentChapter;
        }

        function togglePlay() {
            if (isPlaying) {
                synth.pause();
                isPlaying = false;
                document.getElementById("btn-play").innerText = "▶️ 繼續播放";
            } else {
                if(synth.paused) {
                    synth.resume();
                } else {
                    readParagraph();
                }
                isPlaying = true;
                document.getElementById("btn-play").innerText = "⏸ 暫停播放";
            }
        }

        function readParagraph() {
            if (currentParagraph >= novelData[currentChapter].paragraphs.length) {
                if (currentChapter < novelData.length - 1) {
                    currentChapter++;
                    currentParagraph = 0;
                } else {
                    isPlaying = false;
                    document.getElementById("btn-play").innerText = "▶️ 重新播放";
                    return; 
                }
            }

            renderText(); 
            let textToRead = novelData[currentChapter].paragraphs[currentParagraph];
            let utterance = new SpeechSynthesisUtterance(textToRead);
            
            utterance.lang = 'zh-TW';
            utterance.pitch = 1.05; 
            utterance.rate = 0.95;  
            utterance.volume = 1.0;
            
            let voices = synth.getVoices();
            let bestVoice = voices.find(v => v.name.includes('Xiaoxiao') || v.name.includes('HsiaoYuo') || v.name.includes('HsiaoChen')) 
                         || voices.find(v => v.lang === 'zh-TW' && v.name.includes('Google'))
                         || voices.find(v => v.lang.includes('zh'));
            if (bestVoice) utterance.voice = bestVoice;

            utterance.onend = () => {
                currentParagraph++;
                localStorage.setItem('audiobook_progress_chapter', currentChapter);
                localStorage.setItem('audiobook_progress_para', currentParagraph); 
                if (isPlaying) readParagraph(); 
            };
            synth.speak(utterance);
        }

        speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };

        // 儲存進度 (使用無跨域問題的 no-cors mode 傳送 POST)
        async function syncProgress() {
            try {
                document.getElementById("btn-sync").innerText = "⏳ 儲存中...";
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', // 告訴瀏覽器不要管 CORS 限制，直接送出
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ userId: USER_ID, chapter: currentChapter, paragraphIndex: currentParagraph })
                });
                
                document.getElementById("btn-sync").innerText = "✅ 儲存成功！";
                setTimeout(() => document.getElementById("btn-sync").innerText = "☁️ 儲存進度至雲端", 2500);
            } catch(e) {
                alert("儲存可能失敗，請確認您的網路連線。");
                document.getElementById("btn-sync").innerText = "☁️ 重新儲存";
            }
        }
    </script>
</body>
</html>
