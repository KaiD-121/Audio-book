<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有聲書：瘋了！筆下女魔頭從書裡跑出來了</title>
    <style>
        body {
            font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            background-color: #fcf9f2;
            color: #333;
            line-height: 1.8;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 24px;
            text-align: center;
            color: #4a4a4a;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .doc-link {
            display: block;
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .doc-link a {
            color: #4a90e2;
            text-decoration: none;
            font-weight: bold;
            padding: 5px 10px;
            background-color: #f0f4f8;
            border-radius: 15px;
            transition: 0.3s;
        }
        .doc-link a:hover {
            background-color: #dbeafe;
        }
        .chapter-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }
        select {
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
            width: 70%;
            cursor: pointer;
        }
        h2 { font-size: 18px; color: #666; text-align: center; margin-bottom: 20px;}
        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0 30px 0;
        }
        button {
            background-color: #d4a5a5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover { background-color: #c08585; }
        .text-display p {
            font-size: 17px;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.3s;
            cursor: pointer;
            text-indent: 2em;
            letter-spacing: 0.5px;
        }
        .text-display p:hover { background-color: #fafafa; }
        .highlight {
            background-color: #ffe8e8 !important;
            font-weight: bold;
            color: #b35959;
        }
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; font-size: 20px; color: #b35959; font-weight: bold;
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid #d4a5a5;
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- 讀取中覆蓋層 -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div>從 Google 文件讀取小說內容中...</div>
    </div>

    <div class="container">
        <h1>瘋了！筆下女魔頭從書裡跑出來了</h1>
        
        <!-- Google 文件來源連結 -->
        <div class="doc-link">
            <a href="https://docs.google.com/document/d/1T-PYFvGjYdqLqQQi3nnaQ2u7eMn68eMSHUFjgR1fc_s/edit?tab=t.0" target="_blank">
                📖 點此開啟閱讀原始 Google 文件
            </a>
        </div>
        
        <!-- 章節選擇器 -->
        <div class="chapter-selector">
            <label for="chapter-select"><strong>目錄：</strong></label>
            <select id="chapter-select" onchange="changeChapter()"></select>
        </div>

        <h2 id="chapter-title"></h2>
        
        <div class="controls">
            <button id="btn-play" onclick="togglePlay()">▶️ 播放 / 暫停</button>
            <button id="btn-sync" onclick="syncProgress()">☁️ 儲存進度至雲端</button>
        </div>

        <div id="text-display" class="text-display"></div>
    </div>

    <script>
        // ==========================================
        // 1. 基本設定
        // ==========================================
        // 已經替換為您專屬的 GAS 網址
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwqkMTvEFo-gtBXWWCm0B6wK-HrxT6q4qkwjl-nMw_g5Apjk_4vyLdVE0HKWRAgB38opA/exec"; 
        const USER_ID = "my_audio_user"; 

        // ==========================================
        // 2. 系統狀態變數
        // ==========================================
        let novelData = []; // 改由後端動態載入
        let currentChapter = 0;
        let currentParagraph = 0;
        let isPlaying = false;
        let synth = window.speechSynthesis;

        // 初始化
        document.addEventListener("DOMContentLoaded", async () => {
            await fetchNovelData(); // 先抓小說內容
            await fetchProgress();  // 再抓雲端進度
            buildChapterSelect();   // 建立下拉選單
            renderText();
            document.getElementById("loading-overlay").style.display = "none";
        });

        // 建立章節下拉選單
        function buildChapterSelect() {
            const select = document.getElementById("chapter-select");
            select.innerHTML = "";
            novelData.forEach((chapter, index) => {
                let option = document.createElement("option");
                option.value = index;
                option.text = chapter.title;
                if(index === currentChapter) option.selected = true;
                select.appendChild(option);
            });
        }

        // 使用者透過下拉選單切換章節
        function changeChapter() {
            const select = document.getElementById("chapter-select");
            currentChapter = parseInt(select.value);
            currentParagraph = 0; // 切換章節時，從頭開始念
            synth.cancel();
            renderText();
            if(isPlaying) readParagraph();
        }

        // 渲染小說內容到畫面
        function renderText() {
            if(!novelData[currentChapter]) return;
            document.getElementById("chapter-title").innerText = novelData[currentChapter].title;
            const display = document.getElementById("text-display");
            display.innerHTML = "";
            
            novelData[currentChapter].paragraphs.forEach((pText, index) => {
                let p = document.createElement("p");
                p.innerText = pText;
                p.id = "p-" + index;
                if(index === currentParagraph) p.classList.add("highlight");
                
                // 點擊段落即可跳轉播放進度
                p.onclick = () => {
                    currentParagraph = index;
                    synth.cancel();
                    renderText();
                    if(isPlaying) readParagraph();
                };
                display.appendChild(p);
            });
            
            // 自動滾動到正在閱讀的段落
            const activeP = document.getElementById("p-" + currentParagraph);
            if(activeP) activeP.scrollIntoView({ behavior: "smooth", block: "center" });
            
            // 同步更新下拉選單顯示狀態
            document.getElementById("chapter-select").value = currentChapter;
        }

        // 播放與暫停控制
        function togglePlay() {
            if (isPlaying) {
                synth.pause();
                isPlaying = false;
                document.getElementById("btn-play").innerText = "▶️ 繼續播放";
            } else {
                if(synth.paused) {
                    synth.resume();
                } else {
                    readParagraph();
                }
                isPlaying = true;
                document.getElementById("btn-play").innerText = "⏸ 暫停播放";
            }
        }

        // 語音朗讀 (使用 Edge 瀏覽器效果最佳)
        function readParagraph() {
            if (currentParagraph >= novelData[currentChapter].paragraphs.length) {
                // 自動跳下一章
                if (currentChapter < novelData.length - 1) {
                    currentChapter++;
                    currentParagraph = 0;
                } else {
                    isPlaying = false;
                    document.getElementById("btn-play").innerText = "▶️ 重新播放";
                    return; 
                }
            }

            renderText(); 
            let textToRead = novelData[currentChapter].paragraphs[currentParagraph];
            let utterance = new SpeechSynthesisUtterance(textToRead);
            
            utterance.lang = 'zh-TW';
            utterance.pitch = 1.05; 
            utterance.rate = 0.95;  
            utterance.volume = 1.0;
            
            let voices = synth.getVoices();
            let bestVoice = voices.find(v => v.name.includes('Xiaoxiao') || v.name.includes('HsiaoYuo') || v.name.includes('HsiaoChen')) 
                         || voices.find(v => v.lang === 'zh-TW' && v.name.includes('Google'))
                         || voices.find(v => v.lang.includes('zh'));
            if (bestVoice) utterance.voice = bestVoice;

            utterance.onend = () => {
                currentParagraph++;
                localStorage.setItem('audiobook_progress_chapter', currentChapter);
                localStorage.setItem('audiobook_progress_para', currentParagraph); 
                if (isPlaying) readParagraph(); 
            };
            synth.speak(utterance);
        }

        speechSynthesis.onvoiceschanged = () => { synth.getVoices(); };

        // ==========================================
        // 4. GAS API 連線 (抓小說內容與進度同步)
        // ==========================================
        // 抓取 Google 文件內容
        async function fetchNovelData() {
            try {
                let response = await fetch(GAS_WEB_APP_URL + "?action=getNovel");
                let data = await response.json();
                if(data.error) {
                    alert("讀取文件發生錯誤，請確認 GAS 程式碼設定，並確認該 Google 文件為公開或您有權限讀取。");
                } else {
                    novelData = data;
                }
            } catch(e) {
                alert("無法連線至 Google 文件，請檢查網址設定。");
                console.log(e);
            }
        }

        // 抓取雲端進度
        async function fetchProgress() {
            try {
                let response = await fetch(GAS_WEB_APP_URL + "?action=getProgress&userId=" + USER_ID);
                let data = await response.json();
                currentChapter = data.chapter || parseInt(localStorage.getItem('audiobook_progress_chapter')) || 0;
                currentParagraph = data.paragraphIndex || parseInt(localStorage.getItem('audiobook_progress_para')) || 0;
            } catch(e) {
                console.log("無法獲取雲端進度，載入本地進度");
                currentChapter = parseInt(localStorage.getItem('audiobook_progress_chapter')) || 0;
                currentParagraph = parseInt(localStorage.getItem('audiobook_progress_para')) || 0;
            }
        }

        // 儲存進度
        async function syncProgress() {
            try {
                document.getElementById("btn-sync").innerText = "⏳ 儲存中...";
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ userId: USER_ID, chapter: currentChapter, paragraphIndex: currentParagraph })
                });
                document.getElementById("btn-sync").innerText = "✅ 儲存成功！";
                setTimeout(() => document.getElementById("btn-sync").innerText = "☁️ 儲存進度至雲端", 2500);
            } catch(e) {
                alert("儲存失敗，請確認您的網路連線。");
                document.getElementById("btn-sync").innerText = "☁️ 重新儲存";
            }
        }
    </script>
</body>
</html>
